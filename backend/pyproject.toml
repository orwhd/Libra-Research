[project]
name = "research-canvas-backend"
version = "0.1.0"
description = "WHALES Lab Project 1 - Harness-based Multi-Agent Research Canvas Backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "openai>=1.55.0",
    "httpx>=0.27.2",
    "pandas>=2.2.3",
    "numpy>=2.1.0",
    "networkx>=3.4.2",
    "scipy>=1.14.1",
    "playwright>=1.49.0",
    "matplotlib>=3.9.2",
    "python-dotenv>=1.0.1",
    "sse-starlette>=2.1.3",
    "claude-agent-sdk>=0.2.189",
    "python-docx>=1.2.0",
    "reportlab>=5.1.2",
    "pyarrow>=26.0.1",
    "jsonschema>=4.26.0",
    "pypdf>=7.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
